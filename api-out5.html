<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #000; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }
    #error-log { position: absolute; top: 0; left: 0; background: rgba(255,0,0,0.9); color: white; padding: 20px; font-family: monospace; display: none; width: 100%; box-sizing: border-box; z-index: 9999; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <div id="error-log"></div>
  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById('error-log').style.display = 'block';
      document.getElementById('error-log').innerHTML += '<p>Error: ' + msg + ' (Line: ' + line + ')</p>';
      return false;
    };
    
    // Auto-resize logic
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
  <script>
    // --- AI GENERATED CODE START ---
    // Global variables
let sunRadius = 60; // Base size for the sun
let planetsData = []; // Array to hold planet objects
let zoom = 1; // Zoom level
let globalTiltX = 30; // Global tilt for 3D perspective
let globalTiltY = 0; // Global tilt for 3D perspective
let selectedPlanet = -1; // Index of the hovered planet
let lastMouseX, lastMouseY; // For dragging
let infoText = ""; // Text to display on hover

// Planet data: { name, radius, distance, speed, color, orbitTilt (degrees), angle }
// Radii and distances are relative to Earth's values, scaled for visual representation.
// Speeds are relative to Earth's speed (1 unit per frame)
const BASE_ORBIT_SCALE = 150; // Pixels per AU (Astronomical Unit)
const BASE_PLANET_SCALE = 1000; // Multiplier for planet radii

function setup() {
  createCanvas(windowWidth, windowHeight);
  angleMode(DEGREES); // Use degrees for easier angle management

  planetsData = [
    { name: "Mercury", radius: 0.003 * BASE_PLANET_SCALE, distance: 0.39 * BASE_ORBIT_SCALE, speed: 4.1, color: "#AAAAAA", orbitTilt: 7, angle: random(360) },
    // --- AI GENERATED CODE END ---
    
    // Fallback if AI didn't define setup
    if (typeof setup === 'undefined') {
      window.setup = function() {
        createCanvas(windowWidth, windowHeight);
        background(0);
        fill(255);
        textAlign(CENTER, CENTER);
        text("Simulation failed to generate setup()", width/2, height/2);
      };
    } else {
      const originalSetup = setup;
      window.setup = function() {
        createCanvas(windowWidth, windowHeight);
        originalSetup();
      };
    }
  </script>
</body>
</html>
