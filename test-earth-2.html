<!DOCTYPE html>
<html>
<head>
    <title>3D Earth Simulation</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #000; color: #eee; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0, 0, 0, 0.7); padding: 10px 15px; border-radius: 8px; font-size: 14px; max-width: 300px; }
        #info h1 { margin: 0 0 5px 0; font-size: 1.2em; color: #88c0d0; }
        #info p { margin: 0; line-height: 1.5; }
        #info a { color: #88c0d0; text-decoration: none; }
        #info a:hover { text-decoration: underline; }
        canvas { display: block; }
        .slider-container { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 100; background: rgba(0, 0, 0, 0.7); padding: 8px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
        .slider-container label { font-size: 0.9em; white-space: nowrap; }
        .slider-container input[type="range"] { width: 150px; -webkit-appearance: none; appearance: none; height: 4px; background: #555; outline: none; border-radius: 2px; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #88c0d0; cursor: pointer; border: 2px solid #fff; }
        .slider-container input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #88c0d0; cursor: pointer; border: 2px solid #fff; }
    </style>
    <!-- Three.js (r128) and OrbitControls -->
    
    
</head>
<body>
    <div id="info">
        <h1>3D Earth Simulation</h1>
        <p>Explore a rotating 3D model of Earth. Drag to orbit, scroll to zoom.</p>
        <p>Interactive features: <span id="rotationSpeedVal">1.0x</span> rotation speed, atmospheric glow.</p>
        <p>Data sources: <a href="https://www.solarsystemscope.com/textures/" target="_blank">SolarSystemScope</a></p>
    </div>
    <div class="slider-container">
        <label for="rotationSpeed">Rotation Speed:</label>
        <input type="range" id="rotationSpeed" min="0" max="2" step="0.1" value="1">
    </div>
